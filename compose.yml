services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robo}
      POSTGRES_USER: ${POSTGRES_USER:-robo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robo-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-robo}:${POSTGRES_PASSWORD:-robo-local-only}@db:5432/${POSTGRES_DB:-robo}
      SECRET_KEY: ${SECRET_KEY:-replace-before-production-at-least-32-characters}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@robo.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo-2026!}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@robo.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin-2026!}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - plan-assets:/app/storage/plan-assets
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  plan-assets:
